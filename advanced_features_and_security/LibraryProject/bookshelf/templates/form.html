{# bookshelf/templates/bookshelf/form_example.html #}
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Example Form</title>
</head>
<body>
  <h1>Submit a query</h1>

  <form method="post" action="{% url 'bookshelf:submit_form' %}">
    {% csrf_token %}
    {{ form.as_p }}  {# form fields rendered via Django forms (they do validation) #}
    <button type="submit">Submit</button>
  </form>
</body>
</html>
